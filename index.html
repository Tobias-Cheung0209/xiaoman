<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#66B6FF">
  <title>小满</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <!-- iOS PWA 全屏 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="小满">
  <link rel="stylesheet" href="css/style.css?v=9">
  <link rel="stylesheet" href="css/app-v2.css?v=9">
</head>
<body>
  <!-- 梦幻背景装饰 -->
  <div id="bg-decor">
    <div class="bubble b1"></div>
    <div class="bubble b2"></div>
    <div class="bubble b3"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="star s1"></div>
    <div class="star s2"></div>
    <div class="star s3"></div>
    <div class="star s4"></div>
  </div>

  <!-- 极简顶栏：仅 home + 齿轮 -->
  <header id="topbar">
    <button id="menu-toggle" aria-label="首页/菜单">🏠</button>
    <span class="topbar-app-name">小满</span>
    <button id="tb-gear" title="设置与备份">⚙</button>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="drawer-head">
        <span class="dh-title">🌈 小满</span>
        <button id="drawer-close" aria-label="关闭">×</button>
      </div>
      <nav id="sidebar-nav"></nav>
    </aside>
    <main id="content">
      <h1 id="content-title" style="display:none">首页</h1>
      <div id="content-body"></div>
    </main>
  </div>

  <div id="backdrop"></div>

  <!-- 弹窗 -->
  <div id="modal">
    <div id="modal-box">
      <div id="modal-head">
        <h3 id="modal-title"></h3>
        <button id="modal-close" aria-label="关闭">×</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="js/config.js?v=9"></script>
  <script src="js/store.js?v=9"></script>
  <script src="js/topbar.js?v=9"></script>
  <script src="js/app.js?v=9"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      Topbar.init();
      App.init();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js?v=9').catch(function () {});
      }
    });
  </script>
</body>
</html>
